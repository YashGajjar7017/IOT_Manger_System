<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IoT Monitor Gateway Console · Minecraft Edition</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>

<body>
  <!-- Mojang Studio Intro -->
  <div id="mojang-intro" class="mojang-intro">
    <div class="mojang-logo">MOJANG</div>
    <div class="mojang-subtitle">STUDIOS</div>
  </div>

  <!-- Giant Snowball Event -->
  <div id="giant-snowball" class="snowball-strike"></div>

  <!-- Minecraft Classic theme kelp (wale plants) left and right -->
  <div class="kelp-forest-left">
    <div class="kelp kelp-1"></div>
    <div class="kelp kelp-2"></div>
  </div>
  <div class="kelp-forest-right">
    <div class="kelp kelp-3"></div>
    <div class="kelp kelp-4"></div>
  </div>

  <!-- Minecraft Cherry Grove theme trees left and right -->
  <div class="cherry-forest-left">
    <div class="cherry-tree tree-1">
      <div class="tree-trunk"></div>
      <div class="tree-canopy canopy-1"></div>
      <div class="tree-canopy canopy-2"></div>
      <div class="tree-canopy canopy-3"></div>
    </div>
    <div class="cherry-tree tree-2">
      <div class="tree-trunk"></div>
      <div class="cherry-glow"></div>
      <div class="tree-canopy canopy-1"></div>
      <div class="tree-canopy canopy-2"></div>
      <div class="tree-canopy canopy-3"></div>
    </div>
  </div>

  <div class="cherry-forest-right">
    <div class="cherry-tree tree-3">
      <div class="tree-trunk"></div>
      <div class="tree-canopy canopy-1"></div>
      <div class="tree-canopy canopy-2"></div>
      <div class="tree-canopy canopy-3"></div>
    </div>
    <div class="cherry-tree tree-4">
      <div class="tree-trunk"></div>
      <div class="cherry-glow"></div>
      <div class="tree-canopy canopy-1"></div>
      <div class="tree-canopy canopy-2"></div>
      <div class="tree-canopy canopy-3"></div>
    </div>
  </div>

  <!-- Falling cherry blossom petals container -->
  <div class="petal-layer" id="cherry-petals"></div>

  <!-- Background block items layer -->
  <div class="item-layer" id="block-items"></div>

  <!-- Deep Sea Ocean theme background elements -->
  <div class="ocean-background">
    <div class="ocean-sunrays"></div>
    <div class="ocean-bubbles-container" id="ocean-bubbles"></div>
    <div class="background-temple">
      <div class="temple-roof-bg"></div>
      <div class="temple-arch-bg"></div>
      <div class="temple-lantern-bg l1"></div>
      <div class="temple-lantern-bg l2"></div>
      <div class="seabed-flora">
        <div class="kelp-plant kp1">
          <div class="leaf lf1"></div>
          <div class="leaf lf2"></div>
          <div class="leaf lf3"></div>
        </div>
        <div class="kelp-plant kp2">
          <div class="leaf lf1"></div>
          <div class="leaf lf2"></div>
          <div class="leaf lf3"></div>
        </div>
        <div class="kelp-plant kp3">
          <div class="leaf lf1"></div>
          <div class="leaf lf2"></div>
          <div class="leaf lf3"></div>
        </div>
        <div class="kelp-plant kp4">
          <div class="leaf lf1"></div>
          <div class="leaf lf2"></div>
          <div class="leaf lf3"></div>
        </div>
        <div class="sea-flower sf1"></div>
        <div class="sea-flower sf2"></div>
        <div class="sea-flower sf3"></div>
        <div class="sea-flower sf4"></div>
      </div>
    </div>
  </div>

  <!-- Hacking Theme background elements -->
  <div class="hacking-background">
    <div class="matrix-rain" id="matrix-rain"></div>
  </div>

  <!-- React App Root Container -->
  <div id="root"></div>

  <!-- React App Entry Script -->
  <script type="module" src="/src/main.jsx"></script>

  <!-- Background animations and observers -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const itemsContainer = document.getElementById('block-items');
      const petalContainer = document.getElementById('cherry-petals');
      const bubblesContainer = document.getElementById('ocean-bubbles');
      const rainContainer = document.getElementById('matrix-rain');
      const snowball = document.getElementById('giant-snowball');
      const root = document.getElementById('root');

      let activeIntervals = [];
      let activeTimeouts = [];
      let biomeTimer = null;
      let introTimeout = null;

      function trackTimeout(fn, ms) {
        const t = setTimeout(fn, ms);
        activeTimeouts.push(t);
        return t;
      }

      function startMojangIntro() {
        const intro = document.getElementById('mojang-intro');
        if (intro) {
          intro.style.display = 'flex';
          intro.style.animation = 'none';
          void intro.offsetWidth; // force reflow
          intro.style.animation = 'fadeOut 2s forwards 3s';
          
          if (introTimeout) clearTimeout(introTimeout);
          introTimeout = setTimeout(() => {
            startBiomeCycle();
          }, 3000);
        } else {
          startBiomeCycle();
        }
      }

      function startBiomeCycle() {
        let biomes = ['summer', 'winter', 'rain'];
        let currentIndex = 0;

        function switchBiome() {
          stopThemeAnimations();

          // Remove active classes from body/document for other themes
          document.body.className = '';

          let currentBiome = biomes[currentIndex];
          document.body.classList.add('biome-' + currentBiome);

          console.log("Switching to biome: " + currentBiome);

          if (currentBiome === 'summer') {
            startCherryGrove(); // summer is warm, beautiful cherry grove with petals
          } else if (currentBiome === 'rain') {
            startDeepSeaOcean(); // rain is wet, let's use sea theme / bubbles
          } else if (currentBiome === 'winter') {
            startWinter();
          }

          currentIndex = (currentIndex + 1) % biomes.length;
          biomeTimer = setTimeout(switchBiome, 15000); // cycle every 15s
        }
        switchBiome();
      }

      function triggerSnowball() {
        if (snowball && root) {
          snowball.style.display = 'block';
          snowball.classList.remove('snowball-animate');
          void snowball.offsetWidth; // force reflow
          snowball.classList.add('snowball-animate');

          // strike animation hides dashboard
          trackTimeout(() => {
            root.classList.add('dashboard-hidden');
          }, 1500);

          // comes back in seconds
          trackTimeout(() => {
            root.classList.remove('dashboard-hidden');
            snowball.style.display = 'none';
          }, 4000);
        }
      }

      function startWinter() {
        // Winter falling snow
        const floatInterval = setInterval(() => {
          if (itemsContainer && itemsContainer.children.length < 40) {
            const item = document.createElement('div');
            item.className = 'float-block';
            item.textContent = '❄️';
            item.style.left = Math.random() * 95 + '%';
            item.style.fontSize = (12 + Math.random() * 16) + 'px';
            item.style.animationDuration = (8 + Math.random() * 8) + 's';
            itemsContainer.appendChild(item);
            setTimeout(() => { item.remove(); }, 15000);
          }
        }, 300);
        activeIntervals.push(floatInterval);

        // Schedule snowball strike
        const snowballTimeout = setTimeout(triggerSnowball, 5000 + Math.random() * 4000);
        activeIntervals.push(setInterval(triggerSnowball, 12000)); // repeat snowball
      }

      function startMinecraftClassic() {
        stopThemeAnimations();
        const MC_ITEMS = ['🪵', '🪨', '🟩', '💎', '🗡️', '⛏️', '🧪', '📦', '🍎', '🧱'];
        const floatInterval = setInterval(() => {
          if (itemsContainer && itemsContainer.children.length < 15) {
            const item = document.createElement('div');
            item.className = 'float-block';
            item.textContent = MC_ITEMS[Math.floor(Math.random() * MC_ITEMS.length)];
            item.style.left = Math.random() * 90 + 5 + '%';
            item.style.fontSize = (20 + Math.random() * 16) + 'px';
            item.style.animationDuration = (20 + Math.random() * 15) + 's';
            itemsContainer.appendChild(item);
            setTimeout(() => { item.remove(); }, 35000);
          }
        }, 3000);
        activeIntervals.push(floatInterval);
      }

      function startCherryGrove() {
        const CHERRY_ITEMS = ['🌸', '🪵', '🐝', '🍯', '🍒', '💗'];
        const floatInterval = setInterval(() => {
          if (itemsContainer && itemsContainer.children.length < 15) {
            const item = document.createElement('div');
            item.className = 'float-block';
            item.textContent = CHERRY_ITEMS[Math.floor(Math.random() * CHERRY_ITEMS.length)];
            item.style.left = Math.random() * 90 + 5 + '%';
            item.style.fontSize = (20 + Math.random() * 16) + 'px';
            item.style.animationDuration = (20 + Math.random() * 15) + 's';
            itemsContainer.appendChild(item);
            setTimeout(() => { item.remove(); }, 35000);
          }
        }, 3000);
        activeIntervals.push(floatInterval);

        // Falling petals
        const petalInterval = setInterval(() => {
          if (petalContainer && petalContainer.children.length < 50) {
            const petal = document.createElement('div');
            petal.className = 'cherry-petal';
            const colors = ['#ffccd9', '#ff9ebb', '#e57c9f', '#ffb5c0', '#fa819e'];
            petal.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            const size = (6 + Math.random() * 6);
            petal.style.width = size + 'px';
            petal.style.height = size + 'px';
            petal.style.left = Math.random() * 100 + 'vw';
            petal.style.opacity = (0.6 + Math.random() * 0.4);
            const duration = (8 + Math.random() * 8);
            petal.style.animation = `fallAndSway ${duration}s linear forwards`;
            petalContainer.appendChild(petal);
            setTimeout(() => { petal.remove(); }, duration * 1000);
          }
        }, 150);
        activeIntervals.push(petalInterval);
      }

      function startDeepSeaOcean() {
        const OCEAN_ITEMS = ['🫧', '🐠', '🐟', '🐙', '🐚'];
        const floatInterval = setInterval(() => {
          if (itemsContainer && itemsContainer.children.length < 15) {
            const item = document.createElement('div');
            item.className = 'float-block';
            item.textContent = OCEAN_ITEMS[Math.floor(Math.random() * OCEAN_ITEMS.length)];
            item.style.left = Math.random() * 90 + 5 + '%';
            item.style.fontSize = (20 + Math.random() * 16) + 'px';
            item.style.animationDuration = (25 + Math.random() * 15) + 's';
            itemsContainer.appendChild(item);
            setTimeout(() => { item.remove(); }, 40000);
          }
        }, 2500);
        activeIntervals.push(floatInterval);

        // Bubbles
        if (bubblesContainer) {
          const bubbleInterval = setInterval(() => {
            if (bubblesContainer.children.length < 35) {
              const b = document.createElement('div');
              b.className = 'ocean-bubble';
              const size = 4 + Math.random() * 8;
              b.style.width = size + 'px';
              b.style.height = size + 'px';
              b.style.left = Math.random() * 100 + 'vw';
              const duration = 6 + Math.random() * 6;
              b.style.animation = `bubbleRise ${duration}s linear forwards`;
              bubblesContainer.appendChild(b);
              setTimeout(() => { b.remove(); }, duration * 1000);
            }
          }, 350);
          activeIntervals.push(bubbleInterval);
        }
      }

      function startHackingTheme() {
        stopThemeAnimations();
        if (rainContainer) {
          rainContainer.innerHTML = '';
          const colWidth = 20;
          const cols = Math.floor(window.innerWidth / colWidth);
          for (let i = 0; i < cols; i++) {
            const col = document.createElement('div');
            col.className = 'matrix-col';
            col.style.left = i * colWidth + 'px';
            col.style.animationDuration = 2 + Math.random() * 3 + 's';
            col.style.animationDelay = Math.random() * 4 + 's';
            let chars = '';
            const length = 20 + Math.floor(Math.random() * 15);
            for (let j = 0; j < length; j++) {
              chars += Math.random() > 0.5 ? '1' : '0';
            }
            col.textContent = chars;
            rainContainer.appendChild(col);
          }
        }
      }

      function stopThemeAnimations() {
        if (introTimeout) clearTimeout(introTimeout);
        introTimeout = null;
        if (biomeTimer) clearTimeout(biomeTimer);
        biomeTimer = null;
        
        activeIntervals.forEach(clearInterval);
        activeIntervals = [];
        
        activeTimeouts.forEach(clearTimeout);
        activeTimeouts = [];

        if (itemsContainer) itemsContainer.innerHTML = '';
        if (petalContainer) petalContainer.innerHTML = '';
        if (bubblesContainer) bubblesContainer.innerHTML = '';
        if (rainContainer) rainContainer.innerHTML = '';

        if (snowball) {
          snowball.style.display = 'none';
          snowball.classList.remove('snowball-animate');
        }
        if (root) {
          root.classList.remove('dashboard-hidden');
        }
      }

      // Check external theme switcher observer
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          if (mutation.attributeName === 'data-theme') {
            const theme = document.documentElement.getAttribute('data-theme');
            console.log("Observer detected theme change to: " + theme);
            stopThemeAnimations();

            // Clean biome classes from body
            document.body.className = '';

            // Remove Mojang Intro div from display if switching away
            const intro = document.getElementById('mojang-intro');
            if (intro && theme !== 'mojang-studios') {
              intro.style.display = 'none';
            }

            if (theme === 'mojang-studios') {
              startMojangIntro();
            } else if (theme === 'minecraft') {
              startMinecraftClassic();
            } else if (theme === 'cherry-grove') {
              startCherryGrove();
            } else if (theme === 'deep-sea-ocean') {
              startDeepSeaOcean();
            } else if (theme === 'hacking') {
              startHackingTheme();
            }
          }
        });
      });

      observer.observe(document.documentElement, { attributes: true });

      // Run initial theme check
      const initialTheme = document.documentElement.getAttribute('data-theme') || 'mojang-studios';
      console.log("Initial theme is: " + initialTheme);
      if (initialTheme === 'mojang-studios') {
        startMojangIntro();
      } else if (initialTheme === 'minecraft') {
        startMinecraftClassic();
      } else if (initialTheme === 'cherry-grove') {
        startCherryGrove();
      } else if (initialTheme === 'deep-sea-ocean') {
        startDeepSeaOcean();
      } else if (initialTheme === 'hacking') {
        startHackingTheme();
      }
    });
  </script>
</body>

</html>
